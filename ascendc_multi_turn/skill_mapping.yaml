          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.broadcast.ub-broadcast", "section_id": "offsets", "operator_families": ["broadcast"], "when_any": ["ub broadcast", "gm offset", "axis=-1", "axis=-2"], "headings": ["二、广播方式决策", "六、Kernel 实现要点", "八、常见问题"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.broadcast.dynamic-ub-broadcast", "section_id": "constraints", "operator_families": ["broadcast"], "when_any": ["dynamic ub", "dynamic broadcast"], "headings": ["二、API", "三、约束", "四、数据流"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.broadcast.nddma-broadcast", "section_id": "stride-zero", "operator_families": ["broadcast"], "when_any": ["nddma", "multicopy", "stride=0"], "headings": ["二、核心 API：DataCopy + MultiCopyParams", "六、与 UB Broadcast 的对比", "七、约束"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.conversion.patterns", "section_id": "patterns", "operator_families": ["conversion"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.matmul.patterns", "section_id": "patterns", "operator_families": ["matmul"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.sort.patterns", "section_id": "patterns", "operator_families": ["sort"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.flashattention.patterns", "section_id": "patterns", "operator_families": ["flashattention"]}
        ]
      },
      {
        "id": "kernel_api_basics",
        "purpose": "只提供当前设计涉及的基础 API 约束。",
        "expected_artifact": "合法的 buffer、transfer、pipeline 和算术选择。",
        "when": {"always": true},
        "provide": ["计划使用的 API symbol", "dtype", "alignment"],
        "exclude": ["完整 API 目录", "未选择的高级 API"],
        "references": [
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-datacopy", "section_id": "selection", "when_any": ["datacopy", "datacopypad", "copyin", "copyout", "alignment", "tail"], "headings": ["选择规则", "32 字节对齐要求", "常见错误与调试"]},
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-buffer", "section_id": "queues", "when_any": ["tque", "tbuf", "tpipe", "buffer", "ub"], "headings": ["TBuf vs TQue 选择", "TQue 详解"]},
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-pipeline", "section_id": "standard-flow", "when_any": ["enque", "deque", "pipeline", "sync"], "headings": ["解决方案", "EnQue/DeQue 的双重作用"]},
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-arithmetic", "section_id": "applicability", "operator_families": ["elementwise", "broadcast"], "headings": ["适用 API", "常见错误"]},
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-reduce-pattern", "section_id": "overloads", "operator_families": ["reduction"], "headings": ["两种重载形式", "参数说明", "临时空间预留"]},
