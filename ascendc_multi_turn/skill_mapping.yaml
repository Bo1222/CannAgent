        ]
      }
    ]},
    "kernel_design": {"skills": [
      {
        "id": "operator_semantics",
        "purpose": "在选择 API 拼写前应用精确的算子索引、dtype、broadcast、reduction 和 tail 语义。",
        "expected_artifact": "已由活动用例验证的数据搬运和索引方案。",
        "when": {"always": true},
        "provide": ["算子", "活动 profile", "用例特征", "正确性证据"],
        "exclude": ["未验证 API signature", "无关算子族"],
