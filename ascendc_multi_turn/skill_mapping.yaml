        "purpose": "Ground the initial CannAgent pybind/wrapper/kernel launch structure.",
        "expected_artifact": "A consistent NPU pybind, *_do wrapper, kernel entry, descriptor, and stream boundary.",
        "when": {"always": true},
        "provide": ["project Host ABI", "module name", "I/O signature"],
        "exclude": ["registry launch", "CMake/run/test scaffold", "stream(true)", "stream(false)", "unverified includes"],
