          {"knowledge_module_id": "cannagent.operator-invariants", "section_id": "layernorm", "operators": ["layernorm", "layer_norm"], "headings": ["LayerNorm semantic invariants"]},
          {"knowledge_module_id": "cannagent.operator-invariants", "section_id": "permute", "operators": ["permute"], "headings": ["Permute semantic invariants"]},
          {"knowledge_module_id": "cannagent.broadcast-semantics", "section_id": "all", "operator_families": ["broadcast"]}
        ]
      },
      {
