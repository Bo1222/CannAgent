          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-matmul", "section_id": "matmul-basics", "operator_families": ["matmul"]}
        ]
      },
      {
        "id": "synchronization_contract",
        "purpose": "保留确定性的标准 TQue 数据流和显式跨 pipeline 依赖。",
        "expected_artifact": "producer/consumer 所有权匹配且没有陈旧或缺失同步。",
        "when": {"any_terms": ["enque", "deque", "sync", "pipeline", "random", "stale"]},
        "provide": ["当前数据流"],
        "exclude": ["审计脚本", "工作流命令"],
        "references": [
          {"knowledge_module_id": "cannbot.ascendc-sync-audit.references.sync-mechanisms", "section_id": "standard-vector-flow", "headings": ["4.1 标准 Vector 三段流水（EnQue/DeQue 即可）"]},
