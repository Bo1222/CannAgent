{
  "schema_version": 3,
  "format_note": "兼容 JSON 的 YAML；每个引用都通过内置 manifest 的 knowledge_module_id 解析。",
  "audience_budgets": {"planner": 12000, "generator": 20000},
  "operator_families": {
    "elementwise": ["elementwise", "elewise", "gelu", "relu", "sigmoid", "tanh", "exp", "sin", "cos", "abs"],
    "reduction": ["reduction", "reduce", "softmax", "layernorm", "layer_norm", "rmsnorm", "argmax", "argmin", "mean", "sum"],
    "broadcast": ["broadcast", "expand", "add", "sub", "mul", "div"],
    "conversion": ["conversion", "transpose", "permute", "concat", "split", "reshape"],
    "matmul": ["matmul", "gemm", "batchmatmul", "batch_matmul", "groupedmatmul", "group_matmul"],
    "sort": ["sort", "topk", "argsort", "kthvalue"],
    "flashattention": ["flashattention", "flash_attention", "attention", "gqa", "mha", "mla"],
    "simt": ["simt", "thread", "warp", "discrete", "scatter", "gather"]
  },
  "standing_contracts": {"skills": [
    {
      "id": "standing_operator_semantics",
      "role": "foundation",
      "purpose": "在活动 debug 路由变化时持续提供算子索引契约。",
      "expected_artifact": "保留已证明算子语义的修复。",
      "when": {"always": true},
      "provide": ["算子语义不变量"],
      "exclude": ["无关算子族"],
      "references": [
        {"knowledge_module_id": "cannagent.operator-invariants", "section_id": "gelu", "operators": ["gelu"], "headings": ["GELU semantic invariants"]},
        {"knowledge_module_id": "cannagent.operator-invariants", "section_id": "layernorm", "operators": ["layernorm", "layer_norm"], "headings": ["LayerNorm semantic invariants"]},
        {"knowledge_module_id": "cannagent.operator-invariants", "section_id": "permute", "operators": ["permute"], "headings": ["Permute semantic invariants"]},
        {"knowledge_module_id": "cannagent.broadcast-semantics", "section_id": "standing-broadcast", "operator_families": ["broadcast"]}
      ]
    }
  ]},
  "stages": {
