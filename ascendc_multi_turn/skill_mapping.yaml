{
  "schema_version": 3,
  "format_note": "JSON-compatible YAML; every reference resolves through an embedded manifest knowledge_module_id.",
  "audience_budgets": {"planner": 12000, "generator": 20000},
  "operator_families": {
    "elementwise": ["elementwise", "elewise", "gelu", "relu", "sigmoid", "tanh", "exp", "sin", "cos", "abs"],
    "reduction": ["reduction", "reduce", "softmax", "layernorm", "layer_norm", "rmsnorm", "argmax", "argmin", "mean", "sum"],
    "broadcast": ["broadcast", "expand", "add", "sub", "mul", "div"],
    "conversion": ["conversion", "transpose", "permute", "concat", "split", "reshape"],
    "matmul": ["matmul", "gemm", "batchmatmul", "batch_matmul", "groupedmatmul", "group_matmul"],
    "sort": ["sort", "topk", "argsort", "kthvalue"],
    "flashattention": ["flashattention", "flash_attention", "attention", "gqa", "mha", "mla"],
    "simt": ["simt", "thread", "warp", "discrete", "scatter", "gather"]
  },
  "standing_contracts": {"skills": [
    {
      "id": "standing_operator_semantics",
      "role": "foundation",
      "purpose": "Keep the operator indexing contract visible while the active debug route changes.",
      "expected_artifact": "A repair that preserves the proven operator semantics.",
      "when": {"always": true},
      "provide": ["operator semantic invariants"],
      "exclude": ["unrelated operator families"],
      "references": [
        {"knowledge_module_id": "cannagent.operator-invariants", "section_id": "gelu", "operators": ["gelu"], "headings": ["GELU semantic invariants"]},
        {"knowledge_module_id": "cannagent.operator-invariants", "section_id": "layernorm", "operators": ["layernorm", "layer_norm"], "headings": ["LayerNorm semantic invariants"]},
        {"knowledge_module_id": "cannagent.operator-invariants", "section_id": "permute", "operators": ["permute"], "headings": ["Permute semantic invariants"]},
        {"knowledge_module_id": "cannagent.broadcast-semantics", "section_id": "standing-broadcast", "operator_families": ["broadcast"]}
      ]
    }
  ]},
  "stages": {
    "operator_analysis": {"skills": [
      {
        "id": "architecture_context",
        "purpose": "Constrain design to the configured NPU architecture without hard-coded capacities.",
        "expected_artifact": "Architecture identity and runtime-query constraints.",
        "when": {"always": true},
        "provide": ["configured SoC", "runtime and knowledge versions"],
        "exclude": ["Triton guide", "unrelated SKU tables", "hard-coded core or UB capacities"],
        "references": [
          {"knowledge_module_id": "cannbot.npu-arch.references.npu-hardware-params", "section_id": "product-map", "headings": ["0. 产品映射表"]},
          {"knowledge_module_id": "cannbot.npu-arch.references.npu-arch-guide", "section_id": "runtime-capabilities", "headings": ["典型硬件参数与获取方式", "架构兼容性检查清单"]}
        ]
      }
    ]},
    "kernel_design": {"skills": [
      {
        "id": "operator_semantics",
        "purpose": "Apply exact operator indexing, dtype, broadcast, reduction, and tail semantics before API spelling.",
        "expected_artifact": "A data movement and indexing plan proven against active cases.",
        "when": {"always": true},
        "provide": ["operator", "active profile", "case features", "correctness evidence"],
        "exclude": ["unverified API signatures", "unrelated operator families"],
        "references": [
          {"knowledge_module_id": "cannagent.operator-invariants", "section_id": "gelu", "operators": ["gelu"], "headings": ["GELU semantic invariants"]},
          {"knowledge_module_id": "cannagent.operator-invariants", "section_id": "layernorm", "operators": ["layernorm", "layer_norm"], "headings": ["LayerNorm semantic invariants"]},
          {"knowledge_module_id": "cannagent.operator-invariants", "section_id": "permute", "operators": ["permute"], "headings": ["Permute semantic invariants"]},
          {"knowledge_module_id": "cannagent.broadcast-semantics", "section_id": "all", "operator_families": ["broadcast"]}
        ]
      },
      {
        "id": "tiling_design",
        "purpose": "Choose only the family-specific tiling and data movement branch required by the active profile.",
        "expected_artifact": "Block/tile/tail formulas and legal source spans.",
        "when": {"always": true},
        "provide": ["operator family", "active shape and dtype profile", "alignment and tail features"],
        "exclude": ["all tiling variants at once", "performance-only tuning before correctness"],
        "references": [
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.elewise.patterns", "section_id": "patterns", "operator_families": ["elementwise"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.elewise.tiling", "section_id": "tiling", "operator_families": ["elementwise"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.reduction.patterns", "section_id": "patterns", "operator_families": ["reduction"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.reduction.tiling-fields", "section_id": "fields", "operator_families": ["reduction"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.broadcast.patterns", "section_id": "routing", "operator_families": ["broadcast"], "headings": ["合轴（DimensionCollapse）", "场景判定流程", "通用规则"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.broadcast.onedim", "section_id": "invariants", "operator_families": ["broadcast"], "when_any": ["broadcast", "stride", "[128,128]", "shape profile"], "headings": ["一、分支特征", "四、Kernel 实现要点", "五、常见问题"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.broadcast.ub-broadcast", "section_id": "offsets", "operator_families": ["broadcast"], "when_any": ["ub broadcast", "gm offset", "axis=-1", "axis=-2"], "headings": ["二、广播方式决策", "六、Kernel 实现要点", "八、常见问题"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.broadcast.dynamic-ub-broadcast", "section_id": "constraints", "operator_families": ["broadcast"], "when_any": ["dynamic ub", "dynamic broadcast"], "headings": ["二、API", "三、约束", "四、数据流"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.broadcast.nddma-broadcast", "section_id": "stride-zero", "operator_families": ["broadcast"], "when_any": ["nddma", "multicopy", "stride=0"], "headings": ["二、核心 API：DataCopy + MultiCopyParams", "六、与 UB Broadcast 的对比", "七、约束"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.conversion.patterns", "section_id": "patterns", "operator_families": ["conversion"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.matmul.patterns", "section_id": "patterns", "operator_families": ["matmul"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.sort.patterns", "section_id": "patterns", "operator_families": ["sort"]},
          {"knowledge_module_id": "cannbot.ascendc-tiling-design.references.flashattention.patterns", "section_id": "patterns", "operator_families": ["flashattention"]}
        ]
      },
      {
        "id": "kernel_api_basics",
        "purpose": "Supply only basic API constraints implicated by the design.",
        "expected_artifact": "Legal buffer, transfer, pipeline, and arithmetic choices.",
        "when": {"always": true},
        "provide": ["planned API symbols", "dtype", "alignment"],
        "exclude": ["complete API catalog", "unselected advanced APIs"],
        "references": [
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-datacopy", "section_id": "selection", "when_any": ["datacopy", "datacopypad", "copyin", "copyout", "alignment", "tail"], "headings": ["选择规则", "32 字节对齐要求", "常见错误与调试"]},
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-buffer", "section_id": "queues", "when_any": ["tque", "tbuf", "tpipe", "buffer", "ub"], "headings": ["TBuf vs TQue 选择", "TQue 详解"]},
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-pipeline", "section_id": "standard-flow", "when_any": ["enque", "deque", "pipeline", "sync"], "headings": ["解决方案", "EnQue/DeQue 的双重作用"]},
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-arithmetic", "section_id": "applicability", "operator_families": ["elementwise", "broadcast"], "headings": ["适用 API", "常见错误"]},
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-reduce-pattern", "section_id": "overloads", "operator_families": ["reduction"], "headings": ["两种重载形式", "参数说明", "临时空间预留"]},
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-transpose", "section_id": "constraints", "operator_families": ["conversion"], "headings": ["2. API 级硬约束", "3. 反例与反模式"]},
          {"knowledge_module_id": "cannbot.ascendc-api-best-practices.references.api-matmul", "section_id": "matmul-basics", "operator_families": ["matmul"]}
        ]
      },
      {
        "id": "synchronization_contract",
        "purpose": "Preserve deterministic standard TQue dataflow and explicit cross-pipeline dependencies.",
        "expected_artifact": "Matched producer/consumer ownership without stale or missing synchronization.",
        "when": {"any_terms": ["enque", "deque", "sync", "pipeline", "random", "stale"]},
        "provide": ["current dataflow"],
        "exclude": ["audit scripts", "workflow commands"],
        "references": [
          {"knowledge_module_id": "cannbot.ascendc-sync-audit.references.sync-mechanisms", "section_id": "standard-vector-flow", "headings": ["4.1 标准 Vector 三段流水（EnQue/DeQue 即可）"]},
          {"knowledge_module_id": "cannbot.ascendc-sync-audit.references.fix-patterns", "section_id": "standard-queue-fix", "headings": ["模式 A：标准三段流水 → 改用 EnQue/DeQue"]},
          {"knowledge_module_id": "cannbot.ascendc-sync-audit.references.sync-checklist", "section_id": "redundancy", "headings": ["SYNC-11: 同步冗余/混用"]}
        ]
      }
    ]},
    "code_generation": {"skills": [
      {
